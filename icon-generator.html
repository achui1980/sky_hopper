<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Hopper Icon Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            align-items: center;
        }
        .controls label {
            font-weight: bold;
        }
        .controls input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 60px;
            text-align: center;
        }
        #phaser-canvas {
            display: none; /* Hide the actual canvas */
        }
        img {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button.secondary {
            background: #444;
            font-size: 16px;
            padding: 10px 20px;
        }
        button:hover {
            transform: scale(1.05);
        }
        p {
            color: #ccc;
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Icon Generator</h1>
    
    <div class="container">
        <div class="preview-box">
            <h3>Generated Icon</h3>
            
            <div class="controls">
                <label for="icon-width">Width:</label>
                <input type="number" id="icon-width" value="512" min="64" max="1024">
                <label for="icon-height">Height:</label>
                <input type="number" id="icon-height" value="512" min="64" max="1024">
            </div>
            <button id="regenerate-btn" class="secondary">Regenerate</button>
            <br><br>

            <img id="generated-icon" alt="Generating..." width="256" height="256">
            <br>
            <button id="download-btn">Download icon.png</button>
        </div>
        
        <div class="preview-box" style="text-align: left;">
            <h3>Instructions</h3>
            <ol>
                <li>Enter desired Width and Height.</li>
                <li>Click <strong>Regenerate</strong> to resize.</li>
                <li>Click the <strong>Download</strong> button.</li>
                <li>Save the file as <strong>icon.png</strong> in your project root folder.</li>
                <li>Refresh the game page to see the new favicon!</li>
            </ol>
        </div>
    </div>

    <div id="phaser-canvas"></div>

    <script type="module">
        import { generateTextures } from './js/TextureGenerator.js';

        let game; // Store game instance

        class IconScene extends Phaser.Scene {
            constructor() {
                super({ key: 'IconScene' });
            }

            create() {
                // 1. Generate all game textures
                generateTextures(this);

                // 2. Compose the Icon
                const width = this.sys.game.config.width;
                const height = this.sys.game.config.height;

                // Background Gradient (Sky to Stratosphere)
                const graphics = this.add.graphics();
                graphics.fillGradientStyle(0x87CEEB, 0x87CEEB, 0x4a69bd, 0x4a69bd, 1);
                graphics.fillRect(0, 0, width, height);

                // Add some subtle clouds in background
                const cloud1 = this.add.image(width * 0.2, height * 0.2, 'cloud-white');
                cloud1.setScale(width / 340).setAlpha(0.6);
                
                const cloud2 = this.add.image(width * 0.8, height * 0.7, 'cloud-white');
                cloud2.setScale(width / 250).setAlpha(0.7);
                
                const cloud3 = this.add.image(width * 0.3, height * 0.8, 'cloud-white');
                cloud3.setScale(width / 420).setAlpha(0.5);

                // Add a star
                const star = this.add.image(width * 0.8, height * 0.2, 'coin'); // Reuse coin star style or just draw one
                star.setScale(width / 256).setAlpha(0.8);

                // Main Subject: The Plane
                // Draw a circle background for the plane to pop
                graphics.fillStyle(0xffffff, 0.2);
                graphics.fillCircle(width/2, height/2, width * 0.35);
                
                const plane = this.add.image(width/2, height/2, 'plane-boost');
                plane.setScale(width / 128); // Dynamic scale
                plane.setAngle(-15); // Dynamic angle

                // Add "Speed lines"
                graphics.lineStyle(width * 0.008, 0xffffff, 0.5);
                graphics.lineBetween(width/2 - width*0.3, height/2 + height*0.15, width/2 - width*0.42, height/2 + height*0.19);
                graphics.lineBetween(width/2 - width*0.24, height/2 + height*0.19, width/2 - width*0.35, height/2 + height*0.23);

                // 3. Export to Image
                // Wait for one render frame
                this.time.delayedCall(100, () => {
                    this.game.renderer.snapshot((image) => {
                        const iconImg = document.getElementById('generated-icon');
                        iconImg.src = image.src;
                        
                        // Update preview display size (keep aspect ratio but limit max size)
                        iconImg.style.maxWidth = '256px';
                        iconImg.style.maxHeight = '256px';
                        iconImg.width = 256;
                        iconImg.height = 256;
                        
                        const downloadBtn = document.getElementById('download-btn');
                        downloadBtn.onclick = () => {
                            const link = document.createElement('a');
                            link.download = `icon-${width}x${height}.png`;
                            link.href = image.src;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        };
                    });
                });
            }
        }

        function createGame(width, height) {
            if (game) {
                game.destroy(true);
            }

            const config = {
                type: Phaser.AUTO,
                width: width,
                height: height,
                parent: 'phaser-canvas',
                backgroundColor: '#000000',
                scene: [IconScene],
                scale: {
                    mode: Phaser.Scale.NONE
                },
                preserveDrawingBuffer: true // Important for snapshot
            };

            game = new Phaser.Game(config);
        }

        // Initial creation
        createGame(512, 512);

        // Event Listeners
        document.getElementById('regenerate-btn').addEventListener('click', () => {
            const w = parseInt(document.getElementById('icon-width').value) || 512;
            const h = parseInt(document.getElementById('icon-height').value) || 512;
            createGame(w, h);
        });
    </script>
</body>
</html>
