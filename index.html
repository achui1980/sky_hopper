<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starbound Aviator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score">0</div>
            <div id="start-screen">
                <h1>Starbound Aviator</h1>
                <p>Use ARROW KEYS or A/D to move</p>
                <p>Touch LEFT/RIGHT on mobile</p>
                <p>Bounce on clouds to reach the stars!</p>
                <p class="hint">Collect rockets for a boost!</p>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="game-over-screen" class="hidden">
                <h1>Game Over</h1>
                <p id="final-score">Score: 0</p>
                <button id="restart-btn">Try Again</button>
            </div>
            <div id="pause-screen" class="hidden">
                <h1>PAUSED</h1>
                <p>Press SPACE to continue</p>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
